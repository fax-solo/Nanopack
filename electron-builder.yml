appId: com.nanopack.app
productName: NanoPack
copyright: Copyright © 2025

directories:
  buildResources: resources
  output: release

files:
  - dist/**/*
  - package.json
  - "!dist/renderer/.vite-url"

extraResources:
  - from: vendor/${os}/
    to: vendor/
    filter:
      - "**/*"

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon-256.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Utility

mac: null

publish:
  provider: github
  owner: fax-solo
  repo: Nanopack
  releaseType: release
